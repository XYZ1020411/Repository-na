<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c2d12"><title>象棋2｜線上象棋</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5eee2;color:#302116;font-family:system-ui,"Noto Sans TC",sans-serif}header{text-align:center;background:#7c2d12;color:#fff;padding:16px}h1{margin:0;font-size:1.5rem}main{max-width:900px;margin:auto;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px}.wrap{padding:10px;background:#d9aa64;border-radius:14px}.board{position:relative;aspect-ratio:8/9;background:#e8c78d;border:2px solid #75451e}.grid{position:absolute;inset:5.55% 6.25%;background-image:linear-gradient(to right,transparent calc(100% - 1px),#75451e calc(100% - 1px)),linear-gradient(to bottom,transparent calc(100% - 1px),#75451e calc(100% - 1px));background-size:12.5% 11.111%;pointer-events:none}.river{position:absolute;top:44.44%;left:6.25%;right:6.25%;height:11.12%;display:flex;align-items:center;justify-content:space-around;background:#e8c78d;color:#75451e;font-weight:bold;font-size:clamp(10px,2.5vw,16px)}.pieces{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(10,1fr)}.piece{align-self:center;justify-self:center;width:88%;aspect-ratio:1;border-radius:50%;border:2px solid currentColor;background:#fff0ca;display:grid;place-items:center;font-size:clamp(15px,4.2vw,32px);font-weight:800;line-height:1;padding:0;cursor:pointer;z-index:1}.red{color:#b42318}.black{color:#292521}.selected{background:#ffeb65;outline:3px solid #eab308}.side{background:#fffaf2;padding:14px;border-radius:14px;align-self:start}.status{font-weight:700;line-height:1.5;margin-bottom:12px}.actions{display:grid;gap:8px}button.action{border:0;border-radius:9px;padding:10px;background:#7c2d12;color:#fff;font-size:1rem;cursor:pointer}.secondary{background:#e8d4b7!important;color:#382619!important}.moves{max-height:190px;overflow:auto;white-space:pre-wrap;background:#f8efe1;padding:8px;border-radius:8px;font-size:.9rem}.note{font-size:.88rem;line-height:1.5;color:#685443}@media(max-width:650px){main{grid-template-columns:1fr;padding:9px}.wrap{padding:6px}.piece{border-width:1.5px}}
</style></head><body><header><h1>象棋2</h1><div>中國象棋・雙人輪流對弈</div></header><main><section class="wrap"><div class="board"><div class="grid"></div><div class="river"><span>楚　河</span><span>漢　界</span></div><div class="pieces" id="pieces"></div></div></section><aside class="side"><div class="status" id="status">紅方先行，請選棋子</div><div class="actions"><button class="action" id="reset">重新開始</button><button class="action secondary" id="undo">悔棋</button><button class="action secondary" id="flip">翻轉棋盤</button></div><h3>走棋紀錄</h3><div class="moves" id="moves">尚未開始</div><p class="note">點選棋子，再點目的位置移動。此版本為同一台裝置的雙人模式，提供基本棋子走法；完整比賽規則與網路連線對戰尚未加入。</p></aside></main>
<script>
const initial=[['車','馬','象','士','將','士','象','馬','車'],['','','','','','','','',''],['','砲','','','','','','砲',''],['卒','','卒','','卒','','卒','','卒'],['','','','','','','','',''],['','','','','','','','',''],['兵','','兵','','兵','','兵','','兵'],['','炮','','','','','','炮',''],['','','','','','','','',''],['俥','傌','相','仕','帥','仕','相','傌','俥']];
let b,t,sel,moves,states,flip;
const $=id=>document.getElementById(id);
const side=p=>!p?'':('俥傌相仕帥兵炮'.includes(p)?'r':'k');
function init(){b=initial.map(x=>x.slice());t='r';sel=null;moves=[];states=[];flip=false;draw();msg('紅方先行，請選棋子')}
function msg(s){$('status').textContent=s}
function coord(r,c){return flip?[9-r,8-c]:[r,c]}
function draw(){let e=$('pieces');e.innerHTML='';for(let vr=0;vr<10;vr++)for(let vc=0;vc<9;vc++){let [r,c]=coord(vr,vc),p=b[r][c];if(!p)continue;let x=document.createElement('button');x.className='piece '+(side(p)==='r'?'red':'black')+(sel&&sel[0]===r&&sel[1]===c?' selected':'');x.style.gridRow=vr+1;x.style.gridColumn=vc+1;x.textContent=p;x.onclick=()=>tap(r,c);e.appendChild(x)}$('moves').textContent=moves.length?moves.map((x,i)=>(i+1)+'. '+x).join('\n'):'尚未開始'}
function tap(r,c){let p=b[r][c];if(!sel){if(p&&side(p)===t){sel=[r,c];draw();msg((t==='r'?'紅':'黑')+'方選了'+p+'，請點目的位置')}return}let [sr,sc]=sel;if(sr===r&&sc===c){sel=null;draw();return}if(p&&side(p)===t){sel=[r,c];draw();return}if(!legal(sr,sc,r,c)){msg('這步不符合目前支援的走法');return}states.push({b:b.map(x=>x.slice()),t,moves:moves.slice()});let q=b[sr][sc],cap=b[r][c];moves.push((t==='r'?'紅':'黑')+'方 '+q+' '+String.fromCharCode(65+sc)+(10-sr)+' → '+String.fromCharCode(65+c)+(10-r)+(cap?' 吃'+cap:''));b[r][c]=q;b[sr][sc]='';sel=null;t=t==='r'?'k':'r';draw();msg(cap&&'帥將'.includes(cap)?'將帥被吃，對局結束！':(t==='r'?'紅':'黑')+'方走棋')}
function legal(sr,sc,r,c){let p=b[sr][sc],q=b[r][c];if(!p||side(p)===side(q))return false;let dr=r-sr,dc=c-sc,ar=Math.abs(dr),ac=Math.abs(dc),forward=side(p)==='r'?-1:1,n=0;if(dr===0){for(let x=Math.min(sc,c)+1;x<Math.max(sc,c);x++)if(b[sr][x])n++}else if(dc===0){for(let y=Math.min(sr,r)+1;y<Math.max(sr,r);y++)if(b[y][sc])n++}let ok=false;
if('車俥'.includes(p))ok=(!dr||!dc)&&n===0;
else if('砲炮'.includes(p))ok=(!dr||!dc)&&(q?n===1:n===0);
else if('馬傌'.includes(p))ok=ar*ac===2&&!b[sr+(ar===2?Math.sign(dr):0)][sc+(ac===2?Math.sign(dc):0)];
else if('象相'.includes(p))ok=ar===2&&ac===2&&(side(p)==='r'?r>=5:r<=4)&&!b[sr+dr/2][sc+dc/2];
else if('士仕'.includes(p))ok=ar===1&&ac===1&&c>=3&&c<=5&&(side(p)==='r'?r>=7:r<=2);
else if('將帥'.includes(p))ok=(ar+ac===1&&c>=3&&c<=5&&(side(p)==='r'?r>=7&&r<=9:r>=0&&r<=2))||(!dc&&q&&'將帥'.includes(q)&&n===0);
else if('卒兵'.includes(p)){let crossed=side(p)==='r'?sr<=4:sr>=5;ok=(dc===0&&dr===forward)||(crossed&&dr===0&&ac===1)}
if(!ok)return false;let z=b.map(x=>x.slice());z[r][c]=z[sr][sc];z[sr][sc]='';let gs=[];for(let y=0;y<10;y++)for(let x=0;x<9;x++)if('將帥'.includes(z[y][x]))gs.push([y,x]);if(gs.length===2&&gs[0][1]===gs[1][1]){let lo=Math.min(gs[0][0],gs[1][0]),hi=Math.max(gs[0][0],gs[1][0]);for(let y=lo+1;y<hi;y++)if(z[y][gs[0][1]])return true;return false}return true}
$('reset').onclick=init;$('undo').onclick=()=>{if(!states.length){msg('沒有可悔的棋步');return}let s=states.pop();b=s.b;t=s.t;moves=s.moves;sel=null;draw();msg('已悔棋')};$('flip').onclick=()=>{flip=!flip;draw()};init();
</script></body></html>
